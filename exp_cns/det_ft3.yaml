# =====================================================================
#  det_ft3.yaml — PaddleOCR 검출기 파인튜닝 3차: 입력 사진만 K0L17 전처리 (사진에서 각인 외 특징을 줄인 뒤 학습하면 나아지는지 시험)
#  det_ft1.yaml 과 다른 곳: 데이터 폴더(det_ft3\data)와 저장 폴더(det_ft3\model)뿐. 사전학습 가중치는 det_ft1\pretrained 를 읽기만 함 (1차 결과 안 건드림)
#  원본: PaddleOCR configs/det/PP-OCRv6/PP-OCRv6_medium_det.yml 에서 아래만 바꿈
#    - 사전학습 가중치에서 시작, 학습률 0.001 → 0.0001, 에폭 500 → 50, 배치 8 → 4, 자르기 640 → 416, 일꾼 8 → 2, GPU 1장
#    - 데이터 = det_ft3\data (make_det_labels_cns.py --step ftdata3: train 912줄 / val 26장)
#    - 좌우 뒤집기(Fliplr) 뺌 — 거울 글자를 배우지 않게 (방향은 90° 복사본 + ±45° 회전으로 충분)
#    - 검증을 약 1 에폭(228걸음)마다, hmean 최고 가중치가 model\best_accuracy 로 저장됨
#  나머지(±45° 회전, 0.1~2배 크기, 색 흔들기, 640 자르기, 검출 기준 0.2/0.45, unclip 1.4)는 원본 그대로
#  실행 (저장소 맨 위에서):
#    .\.venv_paddle_train\Scripts\python.exe .venv_paddle_train\Lib\site-packages\paddlex\repo_manager\repos\PaddleOCR\tools\train.py -c exp_cns\det_ft3.yaml
# =====================================================================
Global:
  model_name: PP-OCRv6_medium_det # To use static model for inference.
  debug: false
  use_gpu: true
  use_ema: true
  ema_decay: 0.9996
  ema_decay_type: threshold
  epoch_num: &epoch_num 50             # 원본 500 → 사진 912장이라 50 (2 에폭 시험에서 1 에폭 48분 → 자르기 줄인 뒤 다시 정함)
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: D:/dl_deep_imgps/exp_cns/results/det_ft3/model
  save_epoch_step: 10
  eval_batch_step:                     # 원본 1500걸음마다 → 약 1 에폭(912장 / 배치 4 = 228걸음)마다
  - 0
  - 228
  cal_metric_during_train: false
  checkpoints: null
  pretrained_model: D:/dl_deep_imgps/exp_cns/results/det_ft1/pretrained/PP-OCRv6_medium_det_pretrained   # 사전학습 가중치에서 이어서
  save_inference_dir: null
  use_visualdl: false
  infer_img: doc/imgs_en/img_10.jpg
  save_res_path: ./checkpoints/det_db/predicts_db.txt
  d2s_train_image_shape: [3, 640, 640]
  distributed: false                   # GPU 1장

Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: PPLCNetV4
    det: true
    model_size: medium
  Neck:
    name: RepLKPAN
    out_channels: 256
    intracl: true
  Head:
    name: DBHead
    k: 50
    fix_nan: true
    aux_in_channels: 256

Loss:
  name: DBLoss
  main_loss_type: DiceFocalLoss
  alpha: 5
  beta: 10
  focal_alpha: 0.25
  focal_gamma: 2.5
  aux_weight_p4: 0.2
  aux_weight_p3: 0.3
  aux_weight_p2: 0.4

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001                # 원본 0.001(GPU 8장 × 배치 8) → 사진이 적어 1/10
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 1.0e-05

PostProcess:
  name: DBPostProcess
  thresh: 0.2
  box_thresh: 0.45
  max_candidates: 3000
  unclip_ratio: 1.4

Metric:
  name: DetMetric
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: D:/dl_deep_imgps/exp_cns/results/det_ft3/data/
    label_file_list:
      - D:/dl_deep_imgps/exp_cns/results/det_ft3/data/train.txt
    ratio_list: [1.0]
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - CopyPaste: null
    - ColorJitter:
        brightness: 0.4
        contrast: 0.4
        saturation: 0.7
        hue: 0.1
    - IaaAugment:
        augmenter_args:
        - type: Affine
          args:
            p: 0.5
            rotate:
            - -45
            - 45
            fit_output: true
        - type: Resize
          args:
            size:
            - 0.1
            - 2
    - RandomPerspective:
        prob: 0.3
        scale: 0.0
        shear: 20.0
        perspective: 0.001
        fit_output: true
        fill_value: [0, 0, 0]
    - RandomCrop:                        # 원본 640 → 416 (사진이 400×400 이라 640 은 대부분 빈칸, 메모리 8GB 초과로 느려짐)
        size:
        - 416
        - 416
        max_tries: 50
        keep_ratio: true
    - MakeBorderMap:
        shrink_ratio: 0.4
        thresh_min: 0.3
        thresh_max: 0.7
        total_epoch: *epoch_num
    - MakeShrinkMap:
        shrink_ratio: 0.4
        min_text_size: 8
        total_epoch: *epoch_num
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - threshold_map
        - threshold_mask
        - shrink_map
        - shrink_mask
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 4               # 원본 8 → GTX 1070 Ti 8GB
    num_workers: 2                       # Windows 에서 일꾼이 많으면 오류

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: D:/dl_deep_imgps/exp_cns/results/det_ft3/data/
    label_file_list:
      - D:/dl_deep_imgps/exp_cns/results/det_ft3/data/val.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest: null
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - shape
        - polys
        - ignore_tags
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2
profiler_options: null
